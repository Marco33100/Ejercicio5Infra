name: ejercicio5

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dbgestor
      MYSQL_USER: gestor
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la inicialización MySQL no escucha en red, así que no se marca sano antes de tiempo.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: https://github.com/Marco33100/Ejercicio5MyAPIGestor.git#${API_REF:-main}
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: dbgestor
      DB_USER: gestor
      DB_PASSWORD: ${DB_PASSWORD}
      MANAGEMENT_SERVER_PORT: "9091" # métricas solo en la red interna
    ports:
      - "127.0.0.1:8081:8081" # solo local: la API no se expone a Internet
    depends_on:
      mysql:
        condition: service_healthy

  cliente:
    build:
      context: https://github.com/Marco33100/Ejercicio5Cliente.git#${CLIENTE_REF:-main}
    restart: unless-stopped
    environment:
      GESTOR_API_URL: http://api:8081
      MANAGEMENT_SERVER_PORT: "9091"
    ports:
      - "80:8080"
    depends_on:
      - api

  # ---------- Monitoreo y observabilidad ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # solo local; se consulta desde Grafana o por túnel SSH

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: [--path.rootfs=/host]
    pid: host
    volumes:
      - /:/host:ro,rslave

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: [-config.file=/etc/loki/local-config.yaml]
    volumes:
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Falta GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ejercicio5.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  mysql-data:
  prometheus-data:
  loki-data:
  grafana-data:

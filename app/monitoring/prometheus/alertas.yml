groups:
  - name: ejercicio5
    rules:
      - alert: ServicioCaido
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} no responde"
          description: "Prometheus no puede leer las métricas de {{ $labels.job }} desde hace más de 1 minuto."

      - alert: TasaErrores5xxAlta
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Más del 5 % de respuestas 5xx en {{ $labels.application }}"

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95,
            sum by (le, application) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 de {{ $labels.application }} por encima de 1 s"

      - alert: CPUAlta
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU de la VM por encima del 85 %"

      - alert: MemoriaAlta
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memoria de la VM por encima del 90 %"

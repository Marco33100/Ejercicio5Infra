global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CPU, memoria, disco y red de la VM.
  - job_name: vm
    static_configs:
      - targets: ["node-exporter:9100"]

  # Métricas de Spring Boot (Micrometer) en el puerto interno de administración.
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:9091"]

  - job_name: cliente
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cliente:9091"]

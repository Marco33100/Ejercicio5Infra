---
- name: Configurar la VM y desplegar Ejercicio5 (MySQL + API + Cliente)
  hosts: app
  become: true
  gather_facts: false

  vars:
    app_dir: /opt/ejercicio5
    db_password: "{{ lookup('ansible.builtin.env', 'DB_PASSWORD') }}"
    db_root_password: "{{ lookup('ansible.builtin.env', 'DB_ROOT_PASSWORD') }}"
    admin_email: "{{ lookup('ansible.builtin.env', 'ADMIN_EMAIL') }}"
    admin_password: "{{ lookup('ansible.builtin.env', 'ADMIN_PASSWORD') }}"

  tasks:
    - name: Esperar a que la VM acepte SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Leer datos del sistema
      ansible.builtin.setup:

    - name: Validar que los secretos estén definidos
      ansible.builtin.assert:
        that:
          - db_password | length > 0
          - db_root_password | length > 0
          - admin_email | length > 0
          - admin_password | length > 0
        fail_msg: Define DB_PASSWORD, DB_ROOT_PASSWORD, ADMIN_EMAIL y ADMIN_PASSWORD en secrets.env
        quiet: true

    - name: Instalar prerrequisitos
      ansible.builtin.apt:
        name: [ca-certificates, python3-debian, git]
        update_cache: true

    - name: Agregar el repositorio oficial de Docker
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Instalar Docker Engine y Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true

    - name: Asegurar que Docker esté activo al arrancar
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Copiar la definición de la aplicación
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/"
        dest: "{{ app_dir }}/"
        mode: "0644"
        directory_mode: "0755"

    - name: Escribir los secretos de la aplicación
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Construir imágenes desde GitHub y levantar contenedores
      ansible.builtin.command:
        cmd: docker compose up -d --build --remove-orphans
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Verificar API + base de datos (lista de usuarios)
      ansible.builtin.uri:
        url: http://127.0.0.1:8081/buscarUsuarios
        method: POST
        return_content: true
      register: api_check
      until: api_check.status == 200
      retries: 30
      delay: 10

    - name: Verificar cliente web
      ansible.builtin.uri:
        url: http://127.0.0.1/
      register: web_check
      until: web_check.status == 200
      retries: 30
      delay: 10

    - name: Resultado
      ansible.builtin.debug:
        msg: "Desplegado en http://{{ inventory_hostname }} — usuarios en la base: {{ api_check.json | length }}"
